server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API del backend (misma procedencia que la SPA: sin CORS en local).
  location /api/ {
    # Un dataset en ZIP puede pesar más que el límite por defecto de Nginx (1 MB).
    client_max_body_size 25m;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Documentación de la API (OpenAPI y Swagger UI), también servida por el backend.
  location /v3/api-docs {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /swagger-ui {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: cualquier otra ruta devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
