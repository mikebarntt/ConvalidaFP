# Esquema original de la petición. En producción, delante de Nginx hay un proxy que termina HTTPS
# (Caddy, docker-compose.prod.yml) y lo envía en X-Forwarded-Proto; sin proxy delante (arranque
# local), se usa el de la propia petición. El backend marca las cookies como seguras si es https.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Un dataset en ZIP puede pesar más que el límite por defecto de Nginx (1 MB).
  client_max_body_size 25m;

  # Si una subida supera ese límite, Nginx la corta antes de que llegue al backend. Se responde con
  # el mismo formato de error que la API (Problem Details, RFC 9457), en español.
  error_page 413 @upload_too_large;
  location @upload_too_large {
    default_type application/problem+json;
    charset utf-8;
    return 413 '{"type":"about:blank","title":"Fichero demasiado grande","status":413,"detail":"El fichero supera el tamaño máximo de 25 MB."}';
  }

  # API del backend (misma procedencia que la SPA: sin CORS en local).
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Documentación de la API (OpenAPI y Swagger UI), también servida por el backend.
  location /v3/api-docs {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /swagger-ui {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Los ficheros con huella en el nombre no cambian nunca: se pueden guardar en caché un año.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier otra ruta devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
