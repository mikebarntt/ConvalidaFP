spring:
  application:
    name: convalidafp

  # La conexión llega por variables de entorno (SPRING_DATASOURCE_URL, _USERNAME y _PASSWORD).
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Flyway; Hibernate solo comprueba que las entidades encajan con él.
      ddl-auto: validate
  servlet:
    multipart:
      # Tamaño máximo de un dataset subido en ZIP.
      max-file-size: 20MB
      max-request-size: 25MB
  mvc:
    # Errores de la API en formato Problem Details (RFC 9457).
    problemdetails:
      enabled: true

server:
  port: 8080
  # Detrás de Nginx, la IP del cliente llega en X-Forwarded-For (la usa el límite de peticiones).
  forward-headers-strategy: native
  servlet:
    session:
      # Solo los administradores tienen sesión. La cookie no es legible desde JavaScript y no se
      # envía en peticiones que vengan de otros sitios.
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

convalidafp:
  simulation:
    # Tope legal de reconocimiento como fracción de la carga del grado (regla inquebrantable 4).
    # Es un parámetro de configuración: el motor (Fase 2) lo lee de aquí, nunca de un número fijo.
    max-recognition-ratio: 0.25
  api:
    # Segundos que un navegador o un proxy puede reutilizar una respuesta sin volver a preguntar.
    cache-max-age-seconds: 300
    rate-limit:
      # Peticiones por minuto y por IP a la API pública.
      requests-per-minute: 60
    # Orígenes, separados por comas, que pueden llamar a la API desde otro dominio (CORS). Vacío = ninguno:
    # la SPA se sirve desde el mismo dominio que la API.
    allowed-origins: ""
  admin:
    bootstrap:
      # Primer administrador: se crea al arrancar solo si no existe ninguno y solo si se dan las dos
      # variables de entorno (CONVALIDAFP_ADMIN_BOOTSTRAP_USERNAME y _PASSWORD). Vacío = no se crea.
      # Nunca hay una contraseña por defecto.
      username: ""
      password: ""
    login:
      # Intentos fallidos de login permitidos, por usuario y por IP, antes de bloquear nuevos
      # intentos durante lock-minutes.
      max-failures-per-user: 5
      max-failures-per-ip: 20
      lock-minutes: 15
  bootstrap:
    sample-dataset:
      # Carga del dataset de ejemplo (ficticio) al arrancar con la base de datos vacía. Desactivada
      # por defecto: solo docker-compose.yml la activa, para el arranque local.
      enabled: false
      dir: /data/sample

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
